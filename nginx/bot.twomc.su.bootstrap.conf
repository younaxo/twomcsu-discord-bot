# Временный HTTP-конфиг для первого выпуска сертификата Let's Encrypt через webroot-проверку.
# Сервер управляется BT-Panel — webroot для ACME общий для всех сайтов: /www/wwwroot/acme-challenge.
# После успешного certbot этот файл заменяется на bot.twomc.su.conf (scripts/deploy.sh делает это сам).
server {
    listen 80;
    listen [::]:80;
    server_name bot.twomc.su;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
