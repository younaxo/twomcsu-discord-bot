# Отдельный virtual host для панели TWOMC.SU. Сервер управляется BT-Panel — конфиг кладётся
# в /www/server/panel/vhost/nginx/, логи в /www/wwwlogs/, ACME webroot общий для всех сайтов.
# Другие сайты (twomc.su, api.twomc.su, cdn-files.twomc.su и т.д.) этот файл не затрагивает.
server {
    listen 80;
    listen [::]:80;
    server_name bot.twomc.su;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bot.twomc.su;

    ssl_certificate     /etc/letsencrypt/live/bot.twomc.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.twomc.su/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /www/wwwlogs/bot.twomc.su.log;
    error_log  /www/wwwlogs/bot.twomc.su.error.log;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/acme-challenge;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
